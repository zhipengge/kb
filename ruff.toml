# ruff 配置
#
# 选用的规则集偏「能抓到真问题」，而不是「能统一风格到什么程度」。
# 格式化交给 formatter，lint 只关注可能导致 bug 或明显冗余的项。

target-version = "py314"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes：未使用导入/变量、未定义名字
    "W",    # pycodestyle 警告
    "I",    # 导入排序
    "UP",   # pyupgrade：用新版本 Python 的写法
    "B",    # flake8-bugbear：常见的坑
    "SIM",  # 可以简化但语义不变的写法
    "RUF",  # ruff 自身的规则
    "PIE",  # 无意义的代码
    "S",    # bandit 的安全检查
    "TC",   # 类型检查专用导入
]

ignore = [
    # 隐式字符串拼接在多行长文本里是可读性最好的写法，
    # 这个项目里大量用于写论文段落等长文本
    "ISC004",
    # E501 由 formatter 处理，手工断行反而更难读
    "E501",
    # 与 E501 同理：文档字符串里的长行不强制
    "W505",
    # 允许 assert（测试与内部不变式检查都要用）
    "S101",
    # 硬编码密码检查误报太多（这里到处是 "api_key" 这种字段名）
    "S105",
    "S106",
    # 子进程调用：本项目不调用外部命令
    "S603",
    "S607",


    # --- 中文代码库的必然误报 ---
    # RUF001/002/003 检查「易混淆的 Unicode 字符」（西里尔字母 а 冒充拉丁 a 之类），
    # 本意是防同形字攻击。但中文全角标点、间隔号等会被一并报出来，
    # 而本项目大量使用中文注释与文案，这些规则会产出上千条噪音。
    "RUF001",
    "RUF002",
    "RUF003",

    # --- 关闭 S608（SQL 字符串拼接告警）---
    #
    # S608 会标记所有用 f-string / % 构造的 SQL。这个项目里确实有这么几处，
    # 但都是**不可避免**的：SQL 的参数绑定只能用于「值」，表名、列名这类
    # **标识符**无法参数化，必须拼进语句文本。
    #
    # 逐处审计的结论：
    #   * 表名（向量表、FTS 表）—— 全部先过 `kb/utils/sql.py` 的
    #     `safe_identifier()` 正则校验，不合法直接抛错，不会拼进语句；
    #   * WHERE 条件片段 —— 由 `_filter_clause()` 生成的纯字面量，
    #     只决定「有哪些条件」，条件的**取值**一律走命名参数绑定；
    #   * 占位符列表 —— 形如 `:c0,:c1` 的占位符本身，不含用户数据。
    #
    # 也就是说这道告警在这里没有可动作的信息。真正的控制是
    # `safe_identifier()` 那几行代码，而不是散布各处的 noqa 注释
    # （而且在 f-string 起始行写 noqa 也不可行——那会变成字符串内容）。
    "S608",

    # --- 风格取舍 ---
    # SIM103 建议把「多个 if 守卫返回 False，最后返回 True」压成一个复合布尔表达式。
    # 但守卫式写法在条件变多时明显更好读，也更容易加注释说明每个条件为什么存在。
    # 保留守卫式。
    "SIM103",

    # --- 与 SQLAlchemy 冲突 ---
    # TC001/002/003 建议把仅用于类型标注的导入挪进 TYPE_CHECKING 块。
    # 但 SQLAlchemy 在 mapper 配置期要**运行时求值** `Mapped[datetime]` 这类注解
    # （它会解析字符串注解并在模块命名空间里查找），挪走之后模型直接映射失败。
    "TC001",
    "TC002",
    "TC003",
]

[lint.per-file-ignores]
# 测试与演示脚本可以放松一些
"tests/**" = ["S", "SIM"]
"scripts/**" = ["S", "SIM", "TC"]

[lint.isort]
known-first-party = ["kb"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"
